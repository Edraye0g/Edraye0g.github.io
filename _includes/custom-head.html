<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<meta name="description" content="Research notes on computational psychiatry, neuroscience, and bioinformatics by Rayeed Al Mutakabbir">
<meta name="author" content="Rayeed Al Mutakabbir">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fcfbf8" media="(prefers-color-scheme: light)">
