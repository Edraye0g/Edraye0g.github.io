<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<meta name="description" content="Reviews of neuroscience and bioinformatics papers by Rayeed Al Mutakabbir">
<meta name="keywords" content="neuroscience, psychiatry, neuroeconomics, bioinformatics, academic blog">
<meta name="author" content="Rayeed Al Mutakabbir">
<meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
