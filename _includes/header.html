<div class="reading-progress-bar" id="readingProgressBar" aria-hidden="true"></div>

<header class="site-header" role="banner">
  <div class="wrapper site-header-wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      {{ site.author | default: "Rayeed Al Mutakabbir" }}
    </a>

    <nav class="site-nav">
      <div class="trigger">
        <a class="page-link" href="{{ "/posts" | relative_url }}">All Posts</a>
        <a class="page-link" href="{{ "/about" | relative_url }}">About</a>
        <a class="page-link" href="{{ "/contact" | relative_url }}">Contact</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle color theme" title="Toggle theme">
          <span class="theme-toggle-label">theme</span>
        </button>
      </div>
    </nav>
  </div>
</header>
