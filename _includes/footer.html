<footer class="site-footer">
  <div class="wrapper site-footer-wrapper">
    <div class="footer-left">
      <span>© {{ 'now' | date: "%Y" }} {{ site.author | default: "Rayeed Al Mutakabbir" }}</span>
      <span class="footer-sep">·</span>
      <span class="footer-subtext">Biomedical Engineering | Bioinformatics | Cognitive Science</span>
    </div>
    <div class="footer-right">
      <a href="https://github.com/Edraye0g" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span class="footer-sep">·</span>
      <a href="#top" id="backToTopLink">Top ↑</a>
    </div>
  </div>
</footer>

<script>
  (function() {
    // Theme toggle
    var toggleBtn = document.getElementById('theme-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        var currentTheme = document.documentElement.getAttribute('data-theme') || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        try {
          localStorage.setItem('theme', nextTheme);
        } catch (e) {}
      });
    }

    // Reading progress bar
    var progressBar = document.getElementById('readingProgressBar');
    function updateProgress() {
      if (!progressBar) return;
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
      var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      if (scrollHeight > 0) {
        var progress = (scrollTop / scrollHeight) * 100;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
      } else {
        progressBar.style.width = '0%';
      }
    }

    // Back to top link smooth scroll
    var backToTop = document.getElementById('backToTopLink');
    if (backToTop) {
      backToTop.addEventListener('click', function(e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();
  })();
</script>
